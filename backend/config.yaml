# 文件空间后端配置示例
# 无参数运行 filespace 时，实际生效的是用户配置目录下的默认配置文件
# （Linux ~/.config/filespace/config.yaml，不存在则自动创建），
# 本文件仅供参考 / 用 -c 显式指定时使用。
port: 8080         # 监听端口（开发默认；前端 dev 的 /api/* 代理指向此处）
name: ""           # 可选自定义节点名称
# passwd: ""       # 默认访问密码（等价于 -P/--passwd）：应用于未显式设置密码的共享文件夹

shared_folders:
  - path: "/home/ylxc/shared"
    name: "共享资料"
    # passwd: "secret"   # 该文件夹的独立访问密码（留空表示开放，其他节点免密访问）

discovery:
  service_name: "_filespace._tcp"
  domain: "local."

monitor:
  interval_sec: 10
