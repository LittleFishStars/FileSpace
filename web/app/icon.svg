<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="文件空间 FileSpace 图标">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24374f"/>
      <stop offset="1" stop-color="#101a29"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：深色圆角底板 -->
  <rect x="26" y="26" width="460" height="460" rx="112" fill="url(#tile)"/>

  <!-- 前景：互联网络标识（主节点往中心移一点点） -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M214.6 192.3 L358.3 244.9"/>
    <path d="M181.1 225.6 L235.1 373.9"/>
    <path d="M366.9 284.7 L268.8 381.5"/>

    <circle cx="394" cy="258" r="38" stroke="#ffffff" stroke-width="14" fill="none"/>
    <circle cx="246" cy="404" r="32" stroke="#ffffff" stroke-width="14" fill="none"/>

    <circle cx="162" cy="173" r="56" stroke="#ffffff" stroke-width="14" fill="none"/>
    <circle cx="162" cy="173" r="19" stroke="#ffffff" stroke-width="9" fill="none"/>
  </g>
</svg>
